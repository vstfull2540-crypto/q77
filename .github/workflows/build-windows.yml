name: Build Windows VST3

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show toolchain versions
        shell: pwsh
        run: |
          cmake --version
          git --version
          cl

      - name: Validate project inputs
        shell: pwsh
        run: |
          $required = @('CMakeLists.txt', 'Source/PluginProcessor.h', 'Source/PluginProcessor.cpp', 'Source/PluginEditor.h', 'Source/PluginEditor.cpp')
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required project source file is missing: $file"
            }
          }
          # This starter draws its interface in JUCE code and has no mandatory PNG assets.
          Write-Host 'Project source validation passed.'

      - name: Configure project
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 and Standalone
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Verify VST3 artifact
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path 'build' -Filter '*.vst3' -Directory -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $plugin) {
            throw 'Build completed but no .vst3 bundle was found under build/. Check the JUCE target and build log.'
          }
          Write-Host "Verified VST3 bundle: $($plugin.FullName)"

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAM-Audio-Processor-Windows-VST3
          path: build/**/Release/VST3/*.vst3
          if-no-files-found: error
          retention-days: 14
